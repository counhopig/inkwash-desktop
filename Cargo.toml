[package]
name = "inkwash-desktop"
version = "0.5.0"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
anyhow = "1"
btleplug = "0.11"
futures = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "blocking"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serialport = "4"
tauri = { version = "2", features = [] }
tokio = { version = "1", features = ["full"] }
uuid = "1"
# TypeScript bindings for the UI (src-ui/lib/generated/) are derived from the
# wire DTOs in src/ via #[derive(TS)]; `cargo test` regenerates them (see
# src/server.rs). serde-compat (default feature) keeps serde rename/skip
# attributes in sync with the JSON shape.
ts-rs = "12"

[target.'cfg(target_os = "macos")'.dependencies]
objc2-core-wlan = "0.3"

[target.'cfg(target_os = "windows")'.dependencies]
encoding_rs = "0.8"
